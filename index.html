<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101611">
  <title>German Flashcards</title>
  <style>
    :root{
      --bg:#101611;
      --bg-2:#182019;
      --panel:#1c281f;
      --panel-2:#26352a;
      --card:#222f26;
      --text:#f2f0e8;
      --muted:#b7b6aa;
      --border:#445447;

      /* Terra / earth palette */
      --terra:#8fa07a;
      --terra-hover:#a8ba92;
      --clay:#6f825e;
      --sand:#d9c2a3;
      --sage:#93aa7b;
      --sage-soft:#27362a;
      --rust:#b86f52;
      --rust-soft:#3a2822;

      --ochre:#c89b5a;
      --ochre-soft:#3a3020;
      --clay-accent:#c77d61;
      --blue-muted:#7f9ca6;
      --blue-soft:#223138;
      --cream:#e5d7c5;

      --shadow:0 16px 42px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}

    html{color-scheme:dark}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(143,160,122,.09), transparent 28rem),
        radial-gradient(circle at 95% 15%, rgba(201,120,85,.05), transparent 24rem),
        var(--bg);
      color:var(--text);
    }

    .app{
      max-width:1080px;
      margin:auto;
      padding:22px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:42px;
      height:42px;
      border-radius:13px;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,var(--sage) 0%, var(--clay) 62%, var(--clay-accent) 100%);
      color:#1d120e;
      font-weight:900;
      box-shadow:0 8px 20px rgba(143,160,122,.24);
    }

    h1{
      margin:0;
      font-size:25px;
      letter-spacing:-.02em;
    }

    .sub{
      font-size:13px;
      color:var(--muted);
      margin-top:4px;
    }

    .layout{
      display:grid;
      grid-template-columns:275px 1fr;
      gap:16px;
    }

    .panel{
      background:rgba(27,38,29,.94);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .side{
      padding:12px;
      max-height:82vh;
      overflow:auto;
    }

    .main{
      padding:18px;
    }

    .cat{
      font-size:11px;
      letter-spacing:.11em;
      text-transform:uppercase;
      color:var(--sand);
      opacity:.72;
      margin:16px 7px 7px;
      font-weight:800;
    }

    button,select{
      font:inherit;
      color:var(--text);
      border:1px solid var(--border);
      background:var(--panel-2);
      border-radius:10px;
      padding:9px 11px;
    }

    button{
      cursor:pointer;
      transition:.16s ease;
    }

    button:hover{
      border-color:#667a65;
      background:#2b392d;
      transform:translateY(-1px);
    }

    #reset{
      border-color:#5a4940;
      color:#d9c2a3;
      background:#2e2923;
    }

    #reset:hover{
      border-color:var(--clay-accent);
      background:#382b25;
      color:#efd5c7;
    }

    select{
      border-color:#4c5f50;
      background:#223028;
    }

    .deck{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      text-align:left;
      margin:0 0 6px;
      padding:10px 11px;
      background:#202c22;
    }

    .deck.active{
      background:
        linear-gradient(90deg,rgba(143,160,122,.24),rgba(111,130,94,.12)),
        var(--panel-2);
      border-color:rgba(143,160,122,.74);
      box-shadow:
        inset 3px 0 0 var(--sage),
        inset -1px 0 0 rgba(199,125,97,.22);
      font-weight:750;
    }

    .count{
      flex:0 0 auto;
      font-size:12px;
      color:var(--muted);
    }

    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .title strong{
      display:block;
      font-size:18px;
    }

    .title span{
      display:block;
      margin-top:4px;
      font-size:13px;
      color:var(--muted);
    }

    .controls{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .controls label{
      color:var(--muted);
      font-size:13px;
    }

    select{
      margin-left:5px;
      cursor:pointer;
    }

    .card{
      min-height:410px;
      border:1px solid #3f5142;
      border-radius:20px;
      background:
        linear-gradient(145deg,rgba(143,160,122,.055),transparent 45%),
        var(--card);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:38px;
      cursor:pointer;
      position:relative;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025),
        0 14px 34px rgba(0,0,0,.24);
      transition:transform .16s ease,border-color .16s ease;
    }

    .card:hover{
      transform:translateY(-2px);
      border-color:#60745f;
    }

    .label{
      position:absolute;
      left:17px;
      top:15px;
      font-size:11px;
      color:var(--blue-muted);
      text-transform:uppercase;
      letter-spacing:.1em;
      font-weight:800;
    }

    .level{
      position:absolute;
      right:16px;
      top:13px;
      background:rgba(200,155,90,.10);
      border:1px solid rgba(200,155,90,.22);
      padding:5px 9px;
      border-radius:999px;
      font-size:12px;
      color:#e3c891;
    }

    .word{
      font-size:40px;
      font-weight:850;
      line-height:1.14;
      letter-spacing:-.025em;
      max-width:720px;
    }

    .meaning{
      font-size:27px;
      font-weight:750;
      line-height:1.25;
      max-width:720px;
    }

    .example{
      margin-top:28px;
      padding-top:19px;
      border-top:1px solid rgba(199,125,97,.28);
      max-width:640px;
      width:100%;
      font-size:17px;
      line-height:1.58;
      color:#d7dfd2;
    }

    .note{
      color:var(--muted);
      font-size:12px;
      margin-top:11px;
    }

    .hint{
      color:#85927f;
      font-size:12px;
      margin-top:18px;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:9px;
      margin-top:12px;
    }

    .again{
      background:linear-gradient(145deg,var(--rust-soft),#422b24);
      border-color:#784536;
      color:#f0b49d;
    }

    .again:hover{
      background:#4a2d25;
      border-color:var(--clay-accent);
    }

    .known{
      background:linear-gradient(145deg,var(--sage-soft),#2b3b2f);
      border-color:#52654c;
      color:#c6d7b5;
    }

    .known:hover{
      background:#303d2d;
      border-color:var(--sage);
    }

    .primary{
      background:linear-gradient(145deg,var(--sage) 0%, var(--clay) 62%, var(--clay-accent) 100%);
      border-color:var(--terra);
      color:#1c120e;
      font-weight:800;
    }

    .primary:hover{
      background:linear-gradient(145deg,var(--terra-hover),var(--sage));
      border-color:var(--terra-hover);
    }

    .progress{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:13px;
    }

    .bar{
      height:8px;
      background:#243026;
      border:1px solid #344237;
      border-radius:999px;
      overflow:hidden;
      flex:1;
    }

    .fill{
      height:100%;
      background:linear-gradient(90deg,var(--sage) 0%, #a7b98f 62%, var(--ochre) 100%);
      transition:width .22s ease;
    }

    .ptext{
      font-size:12px;
      color:var(--muted);
      min-width:92px;
      text-align:right;
    }

    .empty{
      padding:90px 20px;
      text-align:center;
      color:var(--muted);
    }

    .save-note{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:5px;
      font-size:12px;
      color:#9daf8f;
    }

    .save-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--sage);
      box-shadow:0 0 0 4px rgba(143,160,122,.08);
    }


    .favorite{
      position:absolute;
      left:50%;
      top:14px;
      transform:translateX(-50%);
      border:none;
      background:transparent;
      padding:4px 8px;
      font-size:22px;
      line-height:1;
      color:#7d837a;
      cursor:pointer;
      z-index:2;
    }

    .favorite:hover{
      background:transparent;
      border:none;
      transform:translateX(-50%) scale(1.08);
      color:var(--ochre);
    }

    .favorite.active{
      color:var(--ochre);
      text-shadow:0 0 12px rgba(200,155,90,.28);
    }

    .favorite-tools{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .favorite-tools button{
      flex:1;
      min-width:140px;
    }

    .fav-review{
      background:#312d22;
      border-color:#66583d;
      color:#e4cc95;
    }

    .fav-review:hover{
      background:#3c3426;
      border-color:var(--ochre);
    }

    .fav-count{
      color:var(--ochre);
      font-weight:700;
    }


    .view-switch{display:flex;gap:7px;padding:4px;border:1px solid var(--border);border-radius:12px;background:#1b271f}
    .view-switch button{padding:7px 12px;border:none;background:transparent;color:var(--muted)}
    .view-switch button:hover{transform:none;background:#27372c}
    .view-switch button.active{background:linear-gradient(145deg,var(--sage-soft),#304230);color:#dce9d1;box-shadow:inset 0 0 0 1px #586b53;font-weight:800}
    .browse-wrap{overflow:auto;border:1px solid var(--border);border-radius:15px;background:#19231c}
    .words-table{width:100%;border-collapse:collapse;min-width:900px}
    .words-table th{position:sticky;top:0;z-index:1;text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#d7c39e;background:#243129;border-bottom:1px solid #536052;padding:12px 13px;white-space:nowrap}
    .words-table td{padding:12px 13px;border-bottom:1px solid rgba(83,96,82,.48);vertical-align:top;line-height:1.45}
    .words-table tr:last-child td{border-bottom:none}
    .words-table tbody tr:hover{background:rgba(147,170,123,.055)}
    .word-cell{min-width:160px;font-weight:800;color:#edf1e9}.meaning-cell{min-width:170px;color:#dfd9cf}.example-cell{min-width:260px;color:#d5dfd0}.translation-cell{min-width:240px;color:#bdbbb2}.level-cell{width:65px;color:#e3c891;font-size:12px;white-space:nowrap}
    .table-fav{width:42px;border:none;background:transparent;padding:2px;font-size:20px;color:#777e75}.table-fav:hover{background:transparent;border:none;transform:scale(1.08);color:var(--ochre)}.table-fav.active{color:var(--ochre)}
    .speakable{display:inline-flex;align-items:flex-start;gap:7px;padding:2px 4px;margin:-2px -4px;border:none;background:transparent;color:inherit;text-align:left;cursor:pointer;border-radius:6px}.speakable:hover{border:none;background:rgba(147,170,123,.10);transform:none;color:#f4f5ef}.speaker-icon{flex:0 0 auto;color:var(--sage);font-size:13px;margin-top:2px;opacity:.92}
    .click-speak{cursor:pointer;border-radius:7px;padding:4px 7px;margin:-4px -7px}.click-speak:hover{background:rgba(147,170,123,.09)}.click-speak::after{content:"  🔊";font-size:.42em;vertical-align:middle;color:var(--sage);opacity:.9}
    .tts-note{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#94a58d;margin-top:9px}
    .tts-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;z-index:99;max-width:min(92vw,560px);padding:11px 14px;border:1px solid #695442;border-radius:11px;background:#2d2721;color:#ead9c7;box-shadow:0 12px 34px rgba(0,0,0,.36);transition:.18s ease;font-size:13px;text-align:center}.tts-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .status-new{color:#9da99a}.status-known{color:#b9d2aa}.status-review{color:#e6a88f}

    @media(max-width:760px){
      .app{padding:10px}
      header{align-items:flex-start}
      .layout{grid-template-columns:1fr}
      .side{max-height:230px}
      .main{padding:13px}
      .card{min-height:345px;padding:25px 18px}
      .word{font-size:32px}
      .meaning{font-size:23px}
      .actions{grid-template-columns:1fr 1fr}
      .known{grid-column:1/-1}
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">DE</div>
      <div>
        <h1>German Flashcards</h1>
        <div class="sub">Browse first · Flashcards second · German-only pronunciation</div>
        <div class="save-note"><span class="save-dot"></span>Progress is saved on this device</div>
      </div>
    </div>
    <button id="reset">Reset deck</button>
  </header>

  <div class="layout">
    <aside class="panel side">
      <div class="favorite-tools">
        <button id="reviewFavorites" class="fav-review">★ Review favorites</button>
      </div>
      <div id="list"></div>
    </aside>

    <main class="panel main">
      <div class="toolbar">
        <div class="title">
          <strong id="deckTitle">Choose a deck</strong>
          <span id="deckInfo"></span>
        </div>

        <div class="controls">
          <div class="view-switch" aria-label="View mode">
            <button id="tableViewBtn" class="active">Table</button>
            <button id="flashViewBtn">Flashcards</button>
          </div>
          <div id="flashControls" class="flash-controls">
            <label>
              Front:
              <select id="front">
                <option value="de">German</option>
                <option value="en">English</option>
              </select>
            </label>
            <button id="shuffle" class="primary">Shuffle</button>
          </div>
        </div>
      </div>

      <div id="study" class="empty">Select a deck from the left.</div>
      <div id="ttsToast" class="tts-toast" role="status" aria-live="polite"></div>
    </main>
  </div>
</div>

<script src="data.js"></script>
<script>

const STORAGE_PREFIX = 'gfc:';
const SETTINGS_KEY = STORAGE_PREFIX + 'settings';
const SESSION_VERSION = 2;

let deck = null;
let order = [];
let idx = 0;
let flip = false;
let phase = 'initial';   // initial | review | complete
let reviewRound = 0;
let favoritesMode = false;
let viewMode = 'table';

const list = document.getElementById('list');
const study = document.getElementById('study');
const front = document.getElementById('front');
const title = document.getElementById('deckTitle');
const info = document.getElementById('deckInfo');
const tableViewBtn = document.getElementById('tableViewBtn');
const flashViewBtn = document.getElementById('flashViewBtn');
const flashControls = document.getElementById('flashControls');
const ttsToast = document.getElementById('ttsToast');

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#039;'
}[m]));

const progressKey = id => STORAGE_PREFIX + 'progress:' + id;
const sessionKey = id => STORAGE_PREFIX + 'session:' + id;
const favoritesKey = STORAGE_PREFIX + 'favorites';

function readJSON(key, fallback){
  try{
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  }catch{
    return fallback;
  }
}

function writeJSON(key, value){
  localStorage.setItem(key, JSON.stringify(value));
}

function uniqueNumbers(values){
  return [...new Set((values || []).filter(Number.isInteger))];
}


let germanVoice = null;
let ttsToastTimer = null;

function refreshGermanVoice(){
  if(!('speechSynthesis' in window)){
    germanVoice = null;
    return null;
  }

  const voices = window.speechSynthesis.getVoices() || [];
  const germanVoices = voices.filter(v => /^de(?:-|_)/i.test(v.lang || ''));
  germanVoice = germanVoices.find(v => /^de-DE$/i.test(v.lang || '')) || germanVoices[0] || null;
  return germanVoice;
}

if('speechSynthesis' in window){
  refreshGermanVoice();
  if(window.speechSynthesis.addEventListener){
    window.speechSynthesis.addEventListener('voiceschanged', refreshGermanVoice);
  }
  window.speechSynthesis.onvoiceschanged = refreshGermanVoice;
}

function showTtsMessage(message){
  if(!ttsToast) return;
  ttsToast.textContent = message;
  ttsToast.classList.add('show');
  clearTimeout(ttsToastTimer);
  ttsToastTimer = setTimeout(() => ttsToast.classList.remove('show'), 2800);
}

function speakGerman(text){
  const clean = String(text || '').trim();
  if(!clean) return;

  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    showTtsMessage('Speech synthesis is not supported by this browser.');
    return;
  }

  const voice = refreshGermanVoice();

  // Strict mode: do not let the browser fall back to English or auto-detect.
  if(!voice){
    showTtsMessage('No German voice is available. Playback was blocked instead of using another language.');
    return;
  }

  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(clean);
  utterance.lang = 'de-DE';
  utterance.voice = voice;
  utterance.rate = 0.92;
  utterance.pitch = 1;
  window.speechSynthesis.speak(utterance);
}


function getFavorites(){
  const raw = readJSON(favoritesKey, {});
  return raw && typeof raw === 'object' ? raw : {};
}

function saveFavorites(favs){
  writeJSON(favoritesKey, favs);
}

function favoriteId(deckId, cardIndex){
  return `${deckId}:${cardIndex}`;
}

function isFavorite(deckId, cardIndex){
  const favs = getFavorites();
  return !!favs[favoriteId(deckId, cardIndex)];
}

function toggleFavorite(deckId, cardIndex){
  const favs = getFavorites();
  const id = favoriteId(deckId, cardIndex);

  if(favs[id]){
    delete favs[id];
  }else{
    const d = DECKS.find(x => x.id === deckId);
    const c = d?.cards?.[cardIndex];
    if(c){
      favs[id] = {
        deckId,
        cardIndex,
        category:d.category,
        deckName:d.name,
        de:c.de,
        en:c.en,
        deExample:c.deExample || '',
        enExample:c.enExample || '',
        level:c.level || '',
        note:c.note || ''
      };
    }
  }

  saveFavorites(favs);
}

function favoriteCards(){
  const favs = getFavorites();
  return Object.values(favs)
    .map(f => {
      const d = DECKS.find(x => x.id === f.deckId);
      const c = d?.cards?.[f.cardIndex];
      return d && c ? { ...f, card:c } : null;
    })
    .filter(Boolean);
}

function getSettings(){
  return readJSON(SETTINGS_KEY, {
    front:'de',
    selectedDeck:null
  });
}

function saveSettings(patch){
  writeJSON(SETTINGS_KEY, {
    ...getSettings(),
    ...patch
  });
}

function getProgress(deckId = deck?.id){
  if(!deckId) return {known:[],again:[]};

  const p = readJSON(progressKey(deckId), {known:[],again:[]});
  return {
    known: uniqueNumbers(p.known),
    again: uniqueNumbers(p.again)
  };
}

function saveProgress(p){
  if(!deck) return;

  // A card must never be in both lists.
  const known = uniqueNumbers(p.known);
  const knownSet = new Set(known);
  const again = uniqueNumbers(p.again).filter(x => !knownSet.has(x));

  writeJSON(progressKey(deck.id), {known,again});
}

function saveSession(){
  if(!deck) return;

  writeJSON(sessionKey(deck.id), {
    version:SESSION_VERSION,
    idx,
    order,
    phase,
    reviewRound
  });
}

function makeFreshSession(deckObj){
  const p = getProgress(deckObj.id);
  const graded = new Set([...p.known, ...p.again]);

  // If the user has not seen every card yet, show ONLY unseen cards.
  const unseen = deckObj.cards
    .map((_,i)=>i)
    .filter(i => !graded.has(i));

  if(unseen.length){
    return {
      version:SESSION_VERSION,
      idx:0,
      order:unseen,
      phase:'initial',
      reviewRound:0
    };
  }

  // Once every card has been seen, review ONLY the cards marked Again.
  if(p.again.length){
    return {
      version:SESSION_VERSION,
      idx:0,
      order:[...p.again],
      phase:'review',
      reviewRound:1
    };
  }

  return {
    version:SESSION_VERSION,
    idx:0,
    order:[],
    phase:'complete',
    reviewRound:0
  };
}

function loadSession(deckObj){
  const saved = readJSON(sessionKey(deckObj.id), null);

  const validOrder =
    saved &&
    saved.version === SESSION_VERSION &&
    Array.isArray(saved.order) &&
    saved.order.every(i =>
      Number.isInteger(i) &&
      i >= 0 &&
      i < deckObj.cards.length
    );

  const validIndex =
    validOrder &&
    Number.isInteger(saved.idx) &&
    (
      (saved.order.length === 0 && saved.idx === 0) ||
      (saved.idx >= 0 && saved.idx < saved.order.length)
    );

  const validPhase =
    validIndex &&
    ['initial','review','complete'].includes(saved.phase);

  if(validPhase){
    return {
      version:SESSION_VERSION,
      idx:saved.idx,
      order:saved.order,
      phase:saved.phase,
      reviewRound:Number.isInteger(saved.reviewRound) ? saved.reviewRound : 0
    };
  }

  return makeFreshSession(deckObj);
}

function applySession(session){
  idx = session.idx;
  order = session.order;
  phase = session.phase;
  reviewRound = session.reviewRound;
  flip = false;
}


function updateViewControls(){
  tableViewBtn.classList.toggle('active', viewMode === 'table' && !favoritesMode);
  flashViewBtn.classList.toggle('active', viewMode === 'flashcards' || favoritesMode);
  flashControls.style.display = (viewMode === 'flashcards' || favoritesMode) ? 'flex' : 'none';
  tableViewBtn.disabled = favoritesMode;
}

function setView(mode){
  if(favoritesMode && mode === 'table') return;
  viewMode = mode;
  updateViewControls();
  render();
}

function progressStatus(deckId, cardIndex){
  const p = getProgress(deckId);
  if(p.known.includes(cardIndex)) return ['Known','status-known'];
  if(p.again.includes(cardIndex)) return ['Review','status-review'];
  return ['New','status-new'];
}

function renderTable(){
  if(!deck) return;
  const p = getProgress(deck.id);
  const favCount = deck.cards.filter((_,i)=>isFavorite(deck.id,i)).length;
  info.textContent = `${deck.count} words · ${p.known.length} known · ${p.again.length} to review · ${favCount} favorite${favCount===1?'':'s'}`;

  const rows = deck.cards.map((c,cardIndex)=>{
    const [status,statusClass] = progressStatus(deck.id,cardIndex);
    const fav = isFavorite(deck.id,cardIndex);
    return `
      <tr>
        <td><button class="table-fav ${fav?'active':''}" data-fav-index="${cardIndex}" title="${fav?'Remove from favorites':'Add to favorites'}">${fav?'★':'☆'}</button></td>
        <td class="word-cell"><button class="speakable" data-speak="${esc(c.de)}" title="Play German word"><span>${esc(c.de)}</span><span class="speaker-icon">🔊</span></button></td>
        <td class="meaning-cell">${esc(c.en)}</td>
        <td class="example-cell">${c.deExample ? `<button class="speakable" data-speak="${esc(c.deExample)}" title="Play German example"><span>${esc(c.deExample)}</span><span class="speaker-icon">🔊</span></button>` : '—'}</td>
        <td class="translation-cell">${c.enExample ? esc(c.enExample) : '—'}</td>
        <td class="level-cell">${esc(c.level || '')}</td>
        <td class="${statusClass}">${status}</td>
      </tr>`;
  }).join('');

  study.className='';
  study.innerHTML = `
    <div class="browse-wrap">
      <table class="words-table">
        <thead><tr><th>★</th><th>German</th><th>Meaning</th><th>German example</th><th>Translation</th><th>Level</th><th>Status</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="tts-note">🔊 Audio is allowed only when the browser exposes a voice explicitly marked as German (de / de-DE).</div>`;

  study.querySelectorAll('[data-speak]').forEach(btn=>{
    btn.onclick = e => { e.stopPropagation(); speakGerman(btn.dataset.speak); };
  });
  study.querySelectorAll('[data-fav-index]').forEach(btn=>{
    btn.onclick = () => { toggleFavorite(deck.id,Number(btn.dataset.favIndex)); renderList(); renderTable(); };
  });
}

function renderList(){
  list.innerHTML = '';

  const cats = {};
  DECKS.forEach(d => (cats[d.category] ??= []).push(d));

  for(const [category,decks] of Object.entries(cats)){
    const h = document.createElement('div');
    h.className = 'cat';
    h.textContent = category;
    list.appendChild(h);

    decks.forEach(d => {
      const p = getProgress(d.id);

      const b = document.createElement('button');
      b.className = 'deck' + (deck?.id === d.id ? ' active' : '');
      b.innerHTML = `
        <span>${esc(d.name)}</span>
        <span class="count">${p.known.length}/${d.count}${Object.values(getFavorites()).some(f=>f.deckId===d.id) ? ' ★' : ''}</span>
      `;
      b.onclick = () => selectDeck(d.id);
      list.appendChild(b);
    });
  }
}

function selectDeck(id){
  favoritesMode = false;
  viewMode = 'table';
  deck = DECKS.find(d => d.id === id);
  if(!deck) return;

  applySession(loadSession(deck));

  title.textContent = deck.name;
  saveSettings({selectedDeck:deck.id});
  saveSession();

  renderList();
  updateViewControls();
  render();
}

function currentCardIndex(){
  return order[idx];
}

function goPrevious(){
  if(!deck || phase === 'complete') return;

  if(idx > 0){
    idx--;
    flip = false;
    saveSession();
    render();
  }
}

function startNextRound(){
  const p = getProgress();

  if(p.again.length){
    phase = 'review';
    reviewRound = Math.max(1, reviewRound + 1);
    order = [...p.again];
    idx = 0;
    flip = false;
    saveSession();
    render();
    return;
  }

  phase = 'complete';
  reviewRound = 0;
  order = [];
  idx = 0;
  flip = false;
  saveSession();
  render();
}

function advanceAfterGrade(){
  // Continue through the current round without wrapping.
  if(idx + 1 < order.length){
    idx++;
    flip = false;
    saveSession();
    render();
    return;
  }

  // We reached the end of this round.
  // The next round contains ONLY cards that are still marked Again.
  startNextRound();
}

function grade(type){
  if(!deck || phase === 'complete' || !order.length) return;

  if(favoritesMode){
    if(idx + 1 < order.length){
      idx++;
      flip = false;
      render();
    }else{
      phase = 'complete';
      renderComplete();
    }
    return;
  }

  const p = getProgress();
  const cardIndex = currentCardIndex();

  p.known = p.known.filter(x => x !== cardIndex);
  p.again = p.again.filter(x => x !== cardIndex);

  if(type === 'known'){
    p.known.push(cardIndex);
  }else{
    p.again.push(cardIndex);
  }

  saveProgress(p);
  renderList();
  advanceAfterGrade();
}

function renderComplete(){
  if(favoritesMode){
    const favs = favoriteCards();
    info.textContent = `${favs.length} favorite card${favs.length === 1 ? '' : 's'}`;
    study.className = '';
    study.innerHTML = `
      <div class="card" style="cursor:default">
        <div class="level">Favorites</div>
        <div class="word">Favorites review complete ★</div>
        <div class="example">
          You reviewed all your favorite cards.
        </div>
      </div>
    `;
    return;
  }

  const p = getProgress();
  const pct = Math.round((p.known.length / deck.count) * 100);

  info.textContent = `${deck.count} cards · ${p.known.length} known · 0 to review`;

  study.className = '';
  study.innerHTML = `
    <div class="card" style="cursor:default">
      <div class="level">Done</div>
      <div class="word">Deck complete 🎉</div>
      <div class="example">
        You marked all ${deck.count} cards as Known.
        <br><br>
        Reset this deck whenever you want to study it again from the beginning.
      </div>
      <div class="hint">Your progress is saved locally on this device.</div>
    </div>

    <div class="progress">
      <div class="bar">
        <div class="fill" style="width:${pct}%"></div>
      </div>
      <div class="ptext">${pct}% known</div>
    </div>
  `;
}

function render(){
  if(!deck) return;

  updateViewControls();

  if(viewMode === 'table' && !favoritesMode){
    renderTable();
    return;
  }

  if(phase === 'complete' || !order.length){
    renderComplete();
    return;
  }

  const cardIndex = currentCardIndex();
  const c = favoritesMode ? favoriteCards()[cardIndex]?.card : deck.cards[cardIndex];
  if(!c){
    phase = 'complete';
    renderComplete();
    return;
  }
  const f = front.value;

  const main = flip
    ? (f === 'de' ? c.en : c.de)
    : (f === 'de' ? c.de : c.en);

  const label = flip
    ? (f === 'de' ? 'English' : 'German')
    : (f === 'de' ? 'German' : 'English');

  const ex = flip
    ? (f === 'de'
        ? [c.deExample,c.enExample]
        : [c.enExample,c.deExample]
      ).filter(Boolean).join('<br>')
    : '';

  const p = getProgress();
  const pct = Math.round((p.known.length / deck.count) * 100);

  const roundText = phase === 'initial'
    ? `First pass · ${order.length} unseen card${order.length === 1 ? '' : 's'}`
    : `Review round ${reviewRound} · ${order.length} card${order.length === 1 ? '' : 's'} marked Again`;

  info.textContent =
    `${roundText} · ${p.known.length} known · ${p.again.length} to review`;

  study.className = '';
  study.innerHTML = `
    <div class="card" id="card">
      <button class="favorite ${favoritesMode ? 'active' : (isFavorite(deck.id, cardIndex) ? 'active' : '')}" id="favoriteBtn" title="Favorite">
        ${favoritesMode || isFavorite(deck.id, cardIndex) ? '★' : '☆'}
      </button>
      <div class="label">${label}</div>
      <div class="level">${esc(c.level)}</div>

      <div id="mainCardText" class="${flip ? 'meaning' : 'word'}">${esc(main)}</div>

      ${ex ? `<div class="example" id="exampleCardText">${ex}</div>` : ''}
      ${flip && c.note ? `<div class="note">${esc(c.note)}</div>` : ''}

      <div class="hint">
        ${flip ? 'Tap to hide answer' : 'Tap to reveal answer'} · click German text to hear it
      </div>
    </div>

    <div class="actions">
      <button class="again" id="again">Again</button>
      <button id="prev" ${idx === 0 ? 'disabled' : ''}>Previous</button>
      <button class="known" id="known">Known</button>
    </div>

    <div class="progress">
      <div class="bar">
        <div class="fill" style="width:${pct}%"></div>
      </div>
      <div class="ptext">${idx+1}/${order.length} · ${pct}% known</div>
    </div>
  `;


  const germanMainVisible = (!flip && f === 'de') || (flip && f === 'en');
  const mainCardText = document.getElementById('mainCardText');
  if(germanMainVisible && mainCardText){
    mainCardText.classList.add('click-speak');
    mainCardText.title = 'Click to hear German';
    mainCardText.onclick = e => {
      e.stopPropagation();
      speakGerman(c.de);
    };
  }

  const exampleCardText = document.getElementById('exampleCardText');
  if(flip && c.deExample && exampleCardText){
    exampleCardText.classList.add('click-speak');
    exampleCardText.title = 'Click to hear the German example';
    exampleCardText.onclick = e => {
      e.stopPropagation();
      speakGerman(c.deExample);
    };
  }

  document.getElementById('favoriteBtn').onclick = (e) => {
    e.stopPropagation();

    if(favoritesMode){
      const fav = favoriteCards()[cardIndex];
      if(fav){
        toggleFavorite(fav.deckId, fav.cardIndex);

        const remaining = favoriteCards();
        if(remaining.length === 0){
          phase = 'complete';
          renderComplete();
          return;
        }

        order = remaining.map((_,i)=>i);
        idx = Math.min(idx, order.length - 1);
        render();
      }
      return;
    }

    toggleFavorite(deck.id, cardIndex);
    render();
  };

  document.getElementById('card').onclick = () => {
    flip = !flip;
    render();
  };

  document.getElementById('prev').onclick = goPrevious;
  document.getElementById('again').onclick = () => grade('again');
  document.getElementById('known').onclick = () => grade('known');
}

tableViewBtn.onclick = () => setView('table');
flashViewBtn.onclick = () => setView('flashcards');

document.getElementById('shuffle').onclick = () => {
  if(!deck || phase === 'complete' || order.length < 2) return;

  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i],order[j]] = [order[j],order[i]];
  }

  idx = 0;
  flip = false;
  saveSession();
  render();
};

front.onchange = () => {
  flip = false;
  saveSettings({front:front.value});
  render();
};

document.getElementById('reset').onclick = () => {
  if(!deck) return;

  if(favoritesMode){
    const favs = favoriteCards();
    order = favs.map((_,i)=>i);
    idx = 0;
    phase = favs.length ? 'review' : 'complete';
    flip = false;
    render();
    return;
  }

  localStorage.removeItem(progressKey(deck.id));
  localStorage.removeItem(sessionKey(deck.id));

  applySession(makeFreshSession(deck));
  saveSession();

  renderList();
  render();
};


document.getElementById('reviewFavorites').onclick = () => {
  const favs = favoriteCards();

  if(!favs.length){
    study.className = 'empty';
    study.innerHTML = 'You have no favorite words yet. Tap ☆ on any card to save it.';
    title.textContent = 'Favorites';
    info.textContent = '0 favorite cards';
    favoritesMode = true;
    viewMode = 'flashcards';
    updateViewControls();
    return;
  }

  favoritesMode = true;
  viewMode = 'flashcards';

  // Keep a real deck object only as a UI anchor; cards are read from favoriteCards().
  deck = DECKS.find(d => d.id === favs[0].deckId) || DECKS[0];
  order = favs.map((_,i)=>i);
  idx = 0;
  phase = 'review';
  reviewRound = 0;
  flip = false;

  title.textContent = 'Favorite Words';
  info.textContent = `${favs.length} favorite card${favs.length === 1 ? '' : 's'}`;
  renderList();
  render();
};

function boot(){
  const settings = getSettings();
  front.value = settings.front === 'en' ? 'en' : 'de';

  renderList();
  updateViewControls();

  const initialDeck =
    DECKS.find(d => d.id === settings.selectedDeck) ||
    DECKS[0];

  if(initialDeck){
    selectDeck(initialDeck.id);
  }
}

boot();

</script>
</body>
</html>
