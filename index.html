<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17130f">
  <title>German Flashcards</title>
  <style>
    :root{
      --bg:#111812;
      --bg-2:#172019;
      --panel:#1b261d;
      --panel-2:#233127;
      --card:#202c22;
      --text:#eef3e8;
      --muted:#aeb9a6;
      --border:#3a4a3c;

      /* Terra / earth palette */
      --terra:#8fa07a;
      --terra-hover:#a9b994;
      --clay:#667854;
      --sand:#d6c39f;
      --sage:#94aa7f;
      --sage-soft:#263326;
      --rust:#a96b4f;
      --rust-soft:#32251f;

      --shadow:0 16px 42px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}

    html{color-scheme:dark}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(143,160,122,.09), transparent 28rem),
        radial-gradient(circle at 95% 15%, rgba(201,120,85,.05), transparent 24rem),
        var(--bg);
      color:var(--text);
    }

    .app{
      max-width:1080px;
      margin:auto;
      padding:22px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo{
      width:42px;
      height:42px;
      border-radius:13px;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,var(--sage),var(--clay));
      color:#1d120e;
      font-weight:900;
      box-shadow:0 8px 20px rgba(143,160,122,.24);
    }

    h1{
      margin:0;
      font-size:25px;
      letter-spacing:-.02em;
    }

    .sub{
      font-size:13px;
      color:var(--muted);
      margin-top:4px;
    }

    .layout{
      display:grid;
      grid-template-columns:275px 1fr;
      gap:16px;
    }

    .panel{
      background:rgba(27,38,29,.94);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .side{
      padding:12px;
      max-height:82vh;
      overflow:auto;
    }

    .main{
      padding:18px;
    }

    .cat{
      font-size:11px;
      letter-spacing:.11em;
      text-transform:uppercase;
      color:var(--sand);
      opacity:.72;
      margin:16px 7px 7px;
      font-weight:800;
    }

    button,select{
      font:inherit;
      color:var(--text);
      border:1px solid var(--border);
      background:var(--panel-2);
      border-radius:10px;
      padding:9px 11px;
    }

    button{
      cursor:pointer;
      transition:.16s ease;
    }

    button:hover{
      border-color:#60745f;
      background:#2b392d;
      transform:translateY(-1px);
    }

    .deck{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      text-align:left;
      margin:0 0 6px;
      padding:10px 11px;
      background:#202c22;
    }

    .deck.active{
      background:linear-gradient(90deg,rgba(143,160,122,.23),rgba(102,120,84,.12));
      border-color:rgba(143,160,122,.72);
      box-shadow:inset 3px 0 0 var(--sage);
      font-weight:750;
    }

    .count{
      flex:0 0 auto;
      font-size:12px;
      color:var(--muted);
    }

    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .title strong{
      display:block;
      font-size:18px;
    }

    .title span{
      display:block;
      margin-top:4px;
      font-size:13px;
      color:var(--muted);
    }

    .controls{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .controls label{
      color:var(--muted);
      font-size:13px;
    }

    select{
      margin-left:5px;
      cursor:pointer;
    }

    .card{
      min-height:410px;
      border:1px solid #3f5142;
      border-radius:20px;
      background:
        linear-gradient(145deg,rgba(143,160,122,.055),transparent 45%),
        var(--card);
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:38px;
      cursor:pointer;
      position:relative;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.025),
        0 14px 34px rgba(0,0,0,.24);
      transition:transform .16s ease,border-color .16s ease;
    }

    .card:hover{
      transform:translateY(-2px);
      border-color:#60745f;
    }

    .label{
      position:absolute;
      left:17px;
      top:15px;
      font-size:11px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.1em;
      font-weight:800;
    }

    .level{
      position:absolute;
      right:16px;
      top:13px;
      background:rgba(228,194,159,.09);
      border:1px solid rgba(228,194,159,.15);
      padding:5px 9px;
      border-radius:999px;
      font-size:12px;
      color:var(--sand);
    }

    .word{
      font-size:40px;
      font-weight:850;
      line-height:1.14;
      letter-spacing:-.025em;
      max-width:720px;
    }

    .meaning{
      font-size:27px;
      font-weight:750;
      line-height:1.25;
      max-width:720px;
    }

    .example{
      margin-top:28px;
      padding-top:19px;
      border-top:1px solid var(--border);
      max-width:640px;
      width:100%;
      font-size:17px;
      line-height:1.58;
      color:#d7dfd2;
    }

    .note{
      color:var(--muted);
      font-size:12px;
      margin-top:11px;
    }

    .hint{
      color:#85927f;
      font-size:12px;
      margin-top:18px;
    }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:9px;
      margin-top:12px;
    }

    .again{
      background:var(--rust-soft);
      border-color:#6c382d;
      color:#f1b49f;
    }

    .again:hover{
      background:#45251f;
      border-color:var(--rust);
    }

    .known{
      background:var(--sage-soft);
      border-color:#48583f;
      color:#bdd0a9;
    }

    .known:hover{
      background:#303d2d;
      border-color:var(--sage);
    }

    .primary{
      background:linear-gradient(145deg,var(--sage),var(--clay));
      border-color:var(--terra);
      color:#1c120e;
      font-weight:800;
    }

    .primary:hover{
      background:linear-gradient(145deg,var(--terra-hover),var(--sage));
      border-color:var(--terra-hover);
    }

    .progress{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:13px;
    }

    .bar{
      height:8px;
      background:#243026;
      border:1px solid #344237;
      border-radius:999px;
      overflow:hidden;
      flex:1;
    }

    .fill{
      height:100%;
      background:linear-gradient(90deg,var(--sage),var(--sand));
      transition:width .22s ease;
    }

    .ptext{
      font-size:12px;
      color:var(--muted);
      min-width:92px;
      text-align:right;
    }

    .empty{
      padding:90px 20px;
      text-align:center;
      color:var(--muted);
    }

    .save-note{
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-top:5px;
      font-size:12px;
      color:#9daf8f;
    }

    .save-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--sage);
      box-shadow:0 0 0 4px rgba(143,160,122,.08);
    }

    @media(max-width:760px){
      .app{padding:10px}
      header{align-items:flex-start}
      .layout{grid-template-columns:1fr}
      .side{max-height:230px}
      .main{padding:13px}
      .card{min-height:345px;padding:25px 18px}
      .word{font-size:32px}
      .meaning{font-size:23px}
      .actions{grid-template-columns:1fr 1fr}
      .known{grid-column:1/-1}
    }
  </style>
</head>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">DE</div>
      <div>
        <h1>German Flashcards</h1>
        <div class="sub">Small decks · German ↔ English · dark terra theme</div>
        <div class="save-note"><span class="save-dot"></span>Progress is saved on this device</div>
      </div>
    </div>
    <button id="reset">Reset deck</button>
  </header>

  <div class="layout">
    <aside class="panel side">
      <div id="list"></div>
    </aside>

    <main class="panel main">
      <div class="toolbar">
        <div class="title">
          <strong id="deckTitle">Choose a deck</strong>
          <span id="deckInfo"></span>
        </div>

        <div class="controls">
          <label>
            Front:
            <select id="front">
              <option value="de">German</option>
              <option value="en">English</option>
            </select>
          </label>
          <button id="shuffle" class="primary">Shuffle</button>
        </div>
      </div>

      <div id="study" class="empty">Select a deck from the left.</div>
    </main>
  </div>
</div>

<script src="data.js"></script>
<script>
const STORAGE_PREFIX = 'gfc:';
const SETTINGS_KEY = STORAGE_PREFIX + 'settings';

let deck = null;
let order = [];
let idx = 0;
let flip = false;

const list = document.getElementById('list');
const study = document.getElementById('study');
const front = document.getElementById('front');
const title = document.getElementById('deckTitle');
const info = document.getElementById('deckInfo');

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#039;'
}[m]));

const progressKey = id => STORAGE_PREFIX + 'progress:' + id;
const sessionKey = id => STORAGE_PREFIX + 'session:' + id;

function readJSON(key, fallback){
  try{
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  }catch{
    return fallback;
  }
}

function writeJSON(key, value){
  localStorage.setItem(key, JSON.stringify(value));
}

function getSettings(){
  return readJSON(SETTINGS_KEY, {
    front:'de',
    selectedDeck:null
  });
}

function saveSettings(patch){
  writeJSON(SETTINGS_KEY, {
    ...getSettings(),
    ...patch
  });
}

function prog(){
  if(!deck) return {known:[],again:[]};
  return readJSON(progressKey(deck.id), {known:[],again:[]});
}

function saveProgress(p){
  writeJSON(progressKey(deck.id), p);
}

function saveSession(){
  if(!deck) return;
  writeJSON(sessionKey(deck.id), {
    idx,
    order
  });
}

function loadSession(deckId, cardCount){
  const saved = readJSON(sessionKey(deckId), null);

  if(
    saved &&
    Array.isArray(saved.order) &&
    saved.order.length === cardCount &&
    Number.isInteger(saved.idx) &&
    saved.idx >= 0 &&
    saved.idx < cardCount
  ){
    return saved;
  }

  return {
    idx:0,
    order:Array.from({length:cardCount}, (_,i)=>i)
  };
}

function renderList(){
  list.innerHTML = '';

  const cats = {};
  DECKS.forEach(d => (cats[d.category] ??= []).push(d));

  for(const [category,decks] of Object.entries(cats)){
    const h = document.createElement('div');
    h.className = 'cat';
    h.textContent = category;
    list.appendChild(h);

    decks.forEach(d => {
      const p = readJSON(progressKey(d.id), {known:[],again:[]});

      const b = document.createElement('button');
      b.className = 'deck' + (deck?.id === d.id ? ' active' : '');
      b.innerHTML = `
        <span>${esc(d.name)}</span>
        <span class="count">${p.known.length}/${d.count}</span>
      `;
      b.onclick = () => selectDeck(d.id);
      list.appendChild(b);
    });
  }
}

function selectDeck(id){
  deck = DECKS.find(d => d.id === id);
  if(!deck) return;

  const session = loadSession(deck.id, deck.cards.length);
  order = session.order;
  idx = session.idx;
  flip = false;

  title.textContent = deck.name;
  saveSettings({selectedDeck:deck.id});
  renderList();
  render();
}

function move(n){
  idx = (idx + n + order.length) % order.length;
  flip = false;
  saveSession();
  render();
}

function grade(type){
  const p = prog();
  const cardIndex = order[idx];

  p.known = p.known.filter(x => x !== cardIndex);
  p.again = p.again.filter(x => x !== cardIndex);

  p[type].push(cardIndex);

  saveProgress(p);
  renderList();
  move(1);
}

function render(){
  if(!deck) return;

  const c = deck.cards[order[idx]];
  const f = front.value;

  const main = flip
    ? (f === 'de' ? c.en : c.de)
    : (f === 'de' ? c.de : c.en);

  const label = flip
    ? (f === 'de' ? 'English' : 'German')
    : (f === 'de' ? 'German' : 'English');

  const ex = flip
    ? (f === 'de'
        ? [c.deExample,c.enExample]
        : [c.enExample,c.deExample]
      ).filter(Boolean).join('<br>')
    : '';

  const p = prog();
  const pct = Math.round((p.known.length / deck.count) * 100);

  info.textContent = `${deck.count} cards · ${p.known.length} known · ${p.again.length} to review`;

  study.className = '';
  study.innerHTML = `
    <div class="card" id="card">
      <div class="label">${label}</div>
      <div class="level">${esc(c.level)}</div>

      <div class="${flip ? 'meaning' : 'word'}">${esc(main)}</div>

      ${ex ? `<div class="example">${ex}</div>` : ''}
      ${flip && c.note ? `<div class="note">${esc(c.note)}</div>` : ''}

      <div class="hint">
        ${flip ? 'Tap to hide answer' : 'Tap to reveal answer'}
      </div>
    </div>

    <div class="actions">
      <button class="again" id="again">Again</button>
      <button id="prev">Previous</button>
      <button class="known" id="known">Known</button>
    </div>

    <div class="progress">
      <div class="bar">
        <div class="fill" style="width:${pct}%"></div>
      </div>
      <div class="ptext">${idx+1}/${deck.count} · ${pct}% known</div>
    </div>
  `;

  document.getElementById('card').onclick = () => {
    flip = !flip;
    render();
  };

  document.getElementById('prev').onclick = () => move(-1);
  document.getElementById('again').onclick = () => grade('again');
  document.getElementById('known').onclick = () => grade('known');
}

document.getElementById('shuffle').onclick = () => {
  if(!deck) return;

  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i],order[j]] = [order[j],order[i]];
  }

  idx = 0;
  flip = false;
  saveSession();
  render();
};

front.onchange = () => {
  flip = false;
  saveSettings({front:front.value});
  render();
};

document.getElementById('reset').onclick = () => {
  if(!deck) return;

  localStorage.removeItem(progressKey(deck.id));
  localStorage.removeItem(sessionKey(deck.id));

  order = deck.cards.map((_,i)=>i);
  idx = 0;
  flip = false;

  renderList();
  render();
};

function boot(){
  const settings = getSettings();
  front.value = settings.front === 'en' ? 'en' : 'de';

  renderList();

  const initialDeck =
    DECKS.find(d => d.id === settings.selectedDeck) ||
    DECKS[0];

  if(initialDeck){
    selectDeck(initialDeck.id);
  }
}

boot();
</script>
</body>
</html>
