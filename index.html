<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>German Flashcards</title><style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#17191d;--muted:#6b7280;--border:#e5e7eb;--soft:#f1f5f9;--dark:#111827;--good:#eaf8ee;--again:#fff0f0}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:1000px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:26px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}.layout{display:grid;grid-template-columns:270px 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px}.side{padding:12px;max-height:82vh;overflow:auto}.main{padding:18px}.cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 6px 6px}.deck{width:100%;display:flex;justify-content:space-between;text-align:left;padding:9px 10px;margin:0 0 5px;border:1px solid var(--border);border-radius:9px;background:#fff;cursor:pointer}.deck.active{background:var(--soft);font-weight:700}.count{font-size:12px;color:var(--muted)}button,select{font:inherit;border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 11px;cursor:pointer}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.title strong{display:block;font-size:18px}.title span{font-size:13px;color:var(--muted)}.card{min-height:390px;border:1px solid var(--border);border-radius:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:34px;cursor:pointer;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.04)}.label{position:absolute;left:16px;top:14px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.level{position:absolute;right:16px;top:12px;background:var(--soft);padding:5px 8px;border-radius:999px;font-size:12px;color:var(--muted)}.word{font-size:38px;font-weight:800;line-height:1.15}.meaning{font-size:26px;font-weight:700}.example{margin-top:26px;padding-top:18px;border-top:1px solid var(--border);max-width:620px;width:100%;font-size:17px;line-height:1.5}.note,.hint{color:var(--muted);font-size:12px;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}.again{background:var(--again)}.known{background:var(--good)}.progress{display:flex;align-items:center;gap:10px;margin-top:12px}.bar{height:7px;background:var(--soft);border-radius:999px;overflow:hidden;flex:1}.fill{height:100%;background:var(--dark)}.ptext{font-size:12px;color:var(--muted);min-width:86px;text-align:right}.empty{padding:80px 20px;text-align:center;color:var(--muted)}@media(max-width:760px){.app{padding:10px}.layout{grid-template-columns:1fr}.side{max-height:220px}.card{min-height:330px;padding:24px 18px}.word{font-size:31px}.meaning{font-size:23px}}
</style></head><body><div class="app"><header><div><h1>German Flashcards</h1><div class="sub">Small decks · German ↔ English · progress saved locally</div></div><button id="reset">Reset deck</button></header><div class="layout"><aside class="panel side"><div id="list"></div></aside><main class="panel main"><div class="toolbar"><div class="title"><strong id="deckTitle">Choose a deck</strong><span id="deckInfo"></span></div><div><label>Front: <select id="front"><option value="de">German</option><option value="en">English</option></select></label> <button id="shuffle">Shuffle</button></div></div><div id="study" class="empty">Select a deck from the left.</div></main></div></div><script src="data.js"></script><script>
let deck=null,order=[],idx=0,flip=false;const list=document.getElementById('list'),study=document.getElementById('study'),front=document.getElementById('front'),title=document.getElementById('deckTitle'),info=document.getElementById('deckInfo');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const k=id=>'gfc:'+id;function prog(){try{return JSON.parse(localStorage.getItem(k(deck.id)))||{known:[],again:[]}}catch{return{known:[],again:[]}}}function save(p){localStorage.setItem(k(deck.id),JSON.stringify(p))}function renderList(){list.innerHTML='';let cats={};DECKS.forEach(d=>(cats[d.category]??=[]).push(d));for(const [c,ds] of Object.entries(cats)){let h=document.createElement('div');h.className='cat';h.textContent=c;list.appendChild(h);ds.forEach(d=>{let b=document.createElement('button');b.className='deck'+(deck?.id===d.id?' active':'');b.innerHTML=`<span>${d.name}</span><span class=count>${d.count}</span>`;b.onclick=()=>select(d.id);list.appendChild(b)})}}function select(id){deck=DECKS.find(d=>d.id===id);order=deck.cards.map((_,i)=>i);idx=0;flip=false;title.textContent=deck.name;renderList();render()}function move(n){idx=(idx+n+order.length)%order.length;flip=false;render()}function grade(t){let p=prog(),ci=order[idx];p.known=p.known.filter(x=>x!==ci);p.again=p.again.filter(x=>x!==ci);p[t].push(ci);save(p);move(1)}function render(){if(!deck)return;let c=deck.cards[order[idx]],f=front.value,main=flip?(f==='de'?c.en:c.de):(f==='de'?c.de:c.en),lab=flip?(f==='de'?'English':'German'):(f==='de'?'German':'English'),ex=flip?(f==='de'?[c.deExample,c.enExample]:[c.enExample,c.deExample]).filter(Boolean).join('<br>'):'';let p=prog(),pct=Math.round(p.known.length/deck.count*100);info.textContent=`${deck.count} cards · ${p.known.length} known`;study.className='';study.innerHTML=`<div class=card id=card><div class=label>${lab}</div><div class=level>${esc(c.level)}</div><div class=${flip?'meaning':'word'}>${esc(main)}</div>${ex?`<div class=example>${ex}</div>`:''}${flip&&c.note?`<div class=note>${esc(c.note)}</div>`:''}<div class=hint>${flip?'Tap to hide answer':'Tap to reveal answer'}</div></div><div class=actions><button class=again id=again>Again</button><button id=prev>Previous</button><button class=known id=known>Known</button></div><div class=progress><div class=bar><div class=fill style="width:${pct}%"></div></div><div class=ptext>${idx+1}/${deck.count} · ${pct}% known</div></div>`;document.getElementById('card').onclick=()=>{flip=!flip;render()};document.getElementById('prev').onclick=()=>move(-1);document.getElementById('again').onclick=()=>grade('again');document.getElementById('known').onclick=()=>grade('known')}document.getElementById('shuffle').onclick=()=>{if(!deck)return;for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}idx=0;flip=false;render()};front.onchange=()=>{flip=false;render()};document.getElementById('reset').onclick=()=>{if(deck){localStorage.removeItem(k(deck.id));render()}};renderList();
</script></body></html>
